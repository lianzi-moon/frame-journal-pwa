/* ============================================================
   定稿：档案手账（保留胶带 / 拍立得 / 手写体 / 硬投影，
   重做配色逻辑、字号层级与间距节奏）
   ============================================================ */
:root{
  --paper:#efe6d2;
  --card:#fffaf0;
  --ink:#1c2a44;
  --muted:#5a6579;
  --line:#1c2a44;
  --rose:#c23a30;
  --rose-soft:#f3dcc0;
  --sage:#2a6f74;
  --sage-soft:#d9e9e2;
  --gold:#e8b71f;
  --gold-soft:#f8e5b4;
  --shadow:5px 6px 0 #1c2a4421;
  --tape:var(--rose);
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif;
  --sans:'DM Sans','Microsoft YaHei','Noto Sans SC',Arial,sans-serif;
}

body{
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 6% 8%,#fff9e9 0,transparent 36%),
    radial-gradient(ellipse at 94% 90%,#e0e5d2 0,transparent 30%),
    repeating-linear-gradient(0deg,#6e5d3d07 0 1px,transparent 1px 4px);
  color:var(--ink);
}

/* ---------- 侧栏 ---------- */
.sidebar{background:linear-gradient(180deg,#ede1c6,#f4ead6 58%,#e8e0ce);border-right:2px solid var(--line)}
.brandmark{
  background:var(--rose);color:#fff;border:2px solid var(--line);
  border-radius:8px;box-shadow:3px 3px 0 var(--line);
}
.brand strong{color:var(--ink)}
.brand small{color:#6b7385;letter-spacing:1.6px}

.nav-label{
  font-family:'DM Sans','Microsoft YaHei',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:1.4px;color:#33425c;margin-bottom:9px;
}
.nav button{
  color:#2b3a54;border:1.5px solid transparent;border-radius:6px;
  font-family:var(--serif);font-size:16px;font-weight:400;
  letter-spacing:.5px;padding:10px 12px;
}
.nav button:hover{background:#f8edcf;border-color:var(--line)}
.nav button.active{
  background:var(--rose);color:#fff;border:2px solid var(--line);
  box-shadow:3px 3px 0 var(--line);font-weight:400;
}
.nav .ico svg{opacity:.85}

.quote{
  border-top:2px solid #d9cfb6;color:#5f6a7d;
  font-family:var(--serif);font-size:14px;line-height:1.9;
}
.quote span{color:var(--rose)}
.local-note{color:#8a8574;font-size:11px;line-height:1.75;letter-spacing:.4px}

.sidebar-utility{border-top:1px solid #d9cfb6}
.sidebar-utility button{color:#7d7663;font-size:11px}
.sidebar-utility button:hover{color:var(--rose)}

.sidebar-idea{
  position:relative;
  background:var(--gold);border:2px solid var(--line);border-radius:7px;
  box-shadow:4px 5px 0 var(--line);
}
.sidebar-idea::before{
  content:"";position:absolute;top:-9px;left:50%;width:64px;height:17px;
  transform:translateX(-50%) rotate(-3deg);z-index:1;border-radius:1px;
  background:linear-gradient(135deg,#fffbeecc,#fffbee88);
  box-shadow:0 1px 2px #1c2a4433;
}
.sidebar-idea-head,.sidebar-idea-head small,.sidebar-idea-head button,
.sidebar-idea-copy,.sidebar-idea-action{color:#3a2b12}
.sidebar-idea-head small{font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.6px}
.sidebar-idea p{
  font-family:var(--serif);
  font-size:15px;line-height:1.8;color:#3a2b12;margin:9px 0 11px;font-weight:400;
}
.sidebar-idea-action{font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* ---------- 字号层级（手写体只做标题与小签，正文回到可读衬线） ---------- */
body{font-size:16px;line-height:1.7}
button,input,textarea,select{font-size:15px}

.crumb{font-family:inherit;font-size:13px;font-weight:600;color:#5a6579;letter-spacing:.3px}

.hero h1,.section-title h1,.memory-home-head h1,.memory-gallery-head h2,
.panel h2,.modal-head h2,.featured-copy h2,.memory-view-copy h2,.anniversary h3,
.upcoming-copy strong,.timeline-head h2,.map-heading h2,.focus-board h3,
.wall-heading h2,.entry h3,.pref-card h3,.memory-card h3{
  font-family:var(--serif);
  font-weight:400;letter-spacing:.6px;color:var(--ink);
}
.hero h1,.section-title h1,.memory-home-head h1{font-size:clamp(30px,2.9vw,38px);line-height:1.3}
.section-title p,.hero p,.memory-home-head span{font-size:14px;line-height:1.75;color:var(--muted)}

.eyebrow{font-family:inherit;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--rose)}
.datepill{
  font-family:var(--serif);font-size:14px;color:#3a2b12;
  background:var(--gold);border:1.5px solid var(--line);border-radius:4px;
  padding:8px 13px;letter-spacing:.8px;
}

/* 卡片标题 18 / 正文 15 / 小签 11 —— 三级拉开，正文换回衬线 */
.entry h3,.pref-card h3,.memory-card h3{font-size:18px;line-height:1.5}
.panel h2,.memory-gallery-head h2,.timeline-head h2,.map-heading h2{font-size:21px;line-height:1.4}
.modal-head h2{font-size:23px}
.memory-view-copy h2{font-size:27px;line-height:1.4}
.featured-copy h2{font-size:31px;line-height:1.32}

.memory-card p,.entry p,.pref-card p,.upcoming-copy p,.anniversary p,
.timeline-empty,.pref-empty,.empty,.memory-empty,.pref-note p,
.featured-copy p,.hero p,.sidebar-idea p{
  font-family:var(--serif);
  font-weight:400;letter-spacing:.2px;line-height:1.85;
}
.memory-card p,.entry p,.pref-card p{font-size:15px;color:#3f4a5e}
.memory-full,.time-detail,.memory-view-copy p{font-size:16px;line-height:1.95;color:#33405a}
.memory-full{font-family:var(--serif);font-weight:400}

.memory-card-meta,.entry-meta,.source,.featured-kicker,.form-note,
.memory-gallery-head small,.panel-head small,.anniversary .label,
.memory-cover-empty small,.upcoming-copy small,.upcoming-date small,
.time-date,.upcoming-head small,.focus-label,.time-filter,.secret{
  font-family:var(--serif);font-weight:400;letter-spacing:.7px;color:#5d6879;
}
.memory-card-meta,.entry-meta{font-size:13px}
.memory-gallery-head small,.panel-head small,.form-note{font-size:12px}
.source,.featured-kicker,.anniversary .label,.upcoming-copy small,.upcoming-date small,
.time-date,.upcoming-head small,.focus-label,.time-filter{font-size:11.5px}
.memory-card details summary,.memory-card-actions button,.entry-actions button{
  font-family:var(--serif);font-size:14px;color:var(--rose);
}
.memory-card-actions button,.entry-actions button{color:#7c8798}
.memory-card-actions button:hover,.entry-actions button:hover{color:var(--rose)}

.tag,.tag.sage,.tag.gold,.secret{
  font-family:var(--serif);font-weight:400;font-size:13px;
  letter-spacing:.9px;border:1.5px solid var(--line);border-radius:3px;
  padding:2px 8px;
}
.tag{background:var(--gold);color:#3a2b12;transform:rotate(-2.5deg)}
.tag.sage{background:#bde0d6;color:#173f4a;transform:rotate(2deg)}
.tag.gold{background:var(--rose-soft);color:#7a2b23;transform:rotate(-1.5deg)}
.secret{
  background:#fff3f1;color:var(--rose);border:1.5px dashed var(--rose);
  transform:rotate(-3deg);font-weight:400;font-size:12px;padding:1px 7px;
}
.mood{font-size:19px;margin-right:6px}

/* ---------- 按钮 ---------- */
.btn{
  background:var(--card);border:2px solid var(--line);border-radius:5px;
  color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;
  letter-spacing:.3px;padding:9px 14px;box-shadow:3px 3px 0 var(--line);
  transition:transform .16s ease-out,box-shadow .16s ease-out,background .16s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--line)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--rose);border-color:var(--line);color:#fff;box-shadow:3px 3px 0 var(--line)}
.btn.primary:hover{background:#b02f26;box-shadow:4px 5px 0 var(--line);filter:none}
.btn.small{font-size:12.5px;padding:7px 11px}
.linkbtn{color:var(--rose);font-family:inherit;font-size:12.5px;font-weight:700}

/* ---------- 卡片：胶带与顶边同色，不再是随机三色 ---------- */
.panel,.memory-card,.entry,.pref-card,.stat,.memory-view{
  background:var(--card);border:2px solid var(--line);border-radius:7px;
  box-shadow:var(--shadow);
}
.stat,.panel{border-radius:7px}
.stat span{font-family:var(--serif);font-size:13px;color:#5d6879;letter-spacing:.7px}
.stat b{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--ink)}
.stat i{border:1.5px solid var(--line);border-radius:6px;background:var(--rose-soft);color:var(--rose)}
.stat:nth-child(2) i{background:var(--sage-soft);color:#1f5d61}
.stat:nth-child(3) i{background:var(--gold-soft);color:#8a6400}

.entry,.pref-card,.memory-card{position:relative;transition:transform .26s cubic-bezier(.2,.7,.3,1),box-shadow .26s}

.entry:nth-child(3n+1),.pref-card:nth-child(3n+1),.memory-card:nth-child(3n+1){--tape:var(--rose);border-top:4px solid var(--rose)}
.entry:nth-child(3n+2),.pref-card:nth-child(3n+2),.memory-card:nth-child(3n+2){--tape:var(--sage);border-top:4px solid var(--sage)}
.entry:nth-child(3n),.pref-card:nth-child(3n),.memory-card:nth-child(3n){--tape:var(--gold);border-top:4px solid var(--gold)}

.entry::before,.pref-card::before,.memory-card::before{
  content:"";position:absolute;top:-12px;left:50%;width:78px;height:23px;
  transform:translateX(-50%) rotate(-2.4deg);z-index:3;pointer-events:none;
  border-radius:1px;
  background:
    linear-gradient(135deg,#ffffff2e,#ffffff0a),
    repeating-linear-gradient(90deg,#ffffff30 0 2px,transparent 2px 7px),
    var(--tape);
  box-shadow:0 1px 3px #1c2a4438;
  transition:transform .26s ease-out;
}
.entry:nth-child(3n+2)::before,.pref-card:nth-child(3n+2)::before,.memory-card:nth-child(3n+2)::before{
  transform:translateX(-50%) rotate(2.1deg);left:calc(50% + 7px);
}
.entry:nth-child(3n)::before,.pref-card:nth-child(3n)::before,.memory-card:nth-child(3n)::before{
  transform:translateX(-50%) rotate(-1.4deg);left:calc(50% - 9px);
}
.entry:hover,.pref-card:hover,.memory-card:hover{
  transform:translateY(-4px) rotate(-.3deg);box-shadow:7px 9px 0 #1c2a442e;
}
.entry:hover::before,.pref-card:hover::before,.memory-card:hover::before{
  transform:translateX(-50%) rotate(0deg);
}

/* ---------- 首页回忆 ---------- */
.featured-memory{
  background:#ddd2b4;border:2px solid var(--line);border-radius:8px;
  box-shadow:7px 8px 0 #1c2a442b;
}
.featured-placeholder{background:linear-gradient(135deg,#f2e6c9,#e6d6b2 58%,#e2cfa6)}
.featured-placeholder::before{
  content:"";position:absolute;width:186px;height:124px;right:8%;bottom:13%;
  border:2px solid var(--line);border-radius:2px;transform:rotate(-7deg);
  background:repeating-linear-gradient(0deg,#c23a30 0 16px,#e8b71f 16px 32px,#2a6f74 32px 48px,#fffaf0 48px 64px);
  box-shadow:6px 6px 0 var(--line);opacity:.92;
}
.featured-placeholder::after{
  content:"";position:absolute;width:122px;height:82px;right:28%;bottom:10%;
  border:2px solid var(--line);border-radius:2px;transform:rotate(8deg);
  background:linear-gradient(135deg,#fffaf0 0 62%,var(--gold) 62%);
  box-shadow:5px 5px 0 var(--line);
}
.featured-placeholder span{opacity:.5}
.featured-memory:has(.featured-placeholder) .featured-shade{
  background:linear-gradient(90deg,#fffaf0e8 0%,#fffaf0ab 46%,transparent 76%);
}
.featured-memory:has(.featured-placeholder) .featured-copy{color:var(--ink)}
.featured-memory:has(.featured-placeholder) .featured-kicker,
.featured-memory:has(.featured-placeholder) .featured-copy p{color:#3d4a5e}
.featured-memory:has(.featured-placeholder) .featured-copy button{
  border:2px solid var(--line);border-radius:4px;background:var(--rose);
  color:#fff;box-shadow:3px 3px 0 var(--line);
}
.featured-kicker{letter-spacing:1.4px}
.featured-copy h2{color:#fff}
.featured-copy p{color:#fdf6e6;font-size:14.5px}
.featured-copy button{
  border:2px solid #ffffffcc;border-radius:4px;background:#fffaf01f;
  color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:8px 13px;
}
/* 无照片时（浅色占位）把文字压回墨色，避免白字压浅底 */
.featured-memory:has(.featured-placeholder) .featured-copy h2{color:var(--ink)}
.featured-memory:has(.featured-placeholder) .featured-copy p{color:#3d4a5e}

/* 画廊 & 拍立得 */
.memory-gallery{gap:16px}
/* 让卡片顶部的胶带能露出卡外，照片区单独收角 */
.memory-card{overflow:visible;padding:0}
.memory-cover-stack{border-radius:5px 5px 0 0}
.memory-cover{
  height:164px;border:6px solid var(--card);border-bottom-width:20px;border-radius:2px;
  box-shadow:0 4px 10px #1c2a4438;transform:rotate(-1.2deg);
  transition:transform .3s ease-out;filter:saturate(1.02);
}
.memory-card:hover .memory-cover{transform:rotate(0deg) translateY(-2px)}
.memory-cover-empty{
  height:164px;min-height:164px;border:6px solid var(--card);border-bottom-width:20px;
  border-radius:2px;box-shadow:0 4px 10px #1c2a4438;transform:rotate(-1.2deg);
  transition:transform .3s ease-out;
  background:linear-gradient(135deg,#f5e8ca,#e9d9b4);color:var(--ink);
  display:grid;place-items:center;gap:7px;
}
.memory-card:hover .memory-cover-empty{transform:rotate(0deg)}
.memory-card:nth-child(3n+2) .memory-cover-empty{background:linear-gradient(135deg,#d9e9e2,#f5e8ca)}
.memory-card:nth-child(3n) .memory-cover-empty{background:linear-gradient(135deg,#f3dcc0,#f5e8ca)}
.memory-cover-empty span{font-size:26px;opacity:.75}
.memory-cover-empty small{
  background:var(--gold);border:1.5px solid var(--line);color:#3a2b12;
  padding:2px 8px;border-radius:3px;font-size:11.5px;letter-spacing:.8px;
}
.memory-cover-stack{padding:5px}
.photo-count{
  right:12px;bottom:12px;border-radius:3px;background:#1c2a44cc;
  padding:3px 8px;font-size:11px;letter-spacing:.6px;font-family:var(--serif);
}
.memory-card-body{padding:13px 16px 16px}
.memory-card h3{margin:8px 0 7px}
.memory-card p{margin:0 0 9px}
.memory-full{
  background:#f8eeda;border-left:3px solid var(--rose);border-radius:0;
  padding:10px 12px;margin-top:8px;
}
.memory-card-actions{margin-top:9px;gap:11px}

.memory-filters select,.toolbar .search,.toolbar .filter{
  border:2px solid var(--line);border-radius:4px;background:var(--card);
  color:var(--ink);font-size:14px;padding:9px 12px;
}
.toolbar .search,.toolbar .filter{min-height:44px}
.memory-filters select{min-height:40px;font-size:13px}

/* 详情弹层 */
.memory-view-back{background:#20201f8c}
.memory-view::before{
  content:"";position:absolute;top:-12px;left:26px;width:84px;height:26px;
  transform:rotate(-4deg);z-index:3;border-radius:1px;
  background:
    linear-gradient(135deg,#ffffff26,#ffffff08),
    repeating-linear-gradient(90deg,#ffffff30 0 2px,transparent 2px 7px),
    var(--rose);
  box-shadow:0 1px 3px #1c2a4438;
}
.memory-view-gallery{padding:16px 22px 0}
.memory-view-gallery img{border:3px solid var(--card);border-radius:2px}
.memory-view-close{
  border:2px solid var(--line);border-radius:4px;background:var(--card);
  color:var(--ink);box-shadow:2px 2px 0 var(--line);
}
.memory-view-copy{padding:22px 26px 26px}
.memory-view-copy small{font-family:var(--serif);font-size:13px;letter-spacing:.8px;color:#5d6879}

.memory-empty,.empty{
  background:var(--card);border:2px dashed #b9ae93;border-radius:7px;color:var(--muted);
}
.memory-empty div{color:var(--rose)}
.memory-empty h2,.empty b{font-family:var(--serif);font-weight:400;color:var(--ink)}

/* ---------- 偏好 ---------- */
.preference-wall{
  background:#e6ecd9;border:2px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
}
.wall-heading p{font-size:12.5px;color:#4d5a48}
.pref-note{
  background:var(--card);border:2px solid var(--line);border-radius:6px;
  box-shadow:3px 4px 0 #1c2a441f;min-height:112px;
}
.pref-note:before{content:'\201C';color:#cfd9c7;font:34px Georgia,serif;right:13px;top:5px}
.pref-note h3{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:.5px;margin:0 24px 8px 0}
.pref-note p{font-size:14px;color:#3f4a5e}
.pref-note .note-meta{font-family:var(--serif);font-size:11.5px;color:#7d8798}
.pref-note .note-actions button{font-family:var(--serif);font-size:12.5px;color:#7d8798}
.pref-note .note-actions button:hover{color:var(--rose)}
.pref-empty{background:var(--card);border:2px dashed #b9ae93;border-radius:6px;color:#6a7280;font-size:13px}
.pref-empty button{color:var(--sage)}
.pref-card .pref-symbol{font-size:19px;margin-bottom:9px}
.pref-card h3{margin:0 0 8px}
.pref-card .source{margin-top:11px}

/* 灵感条 */
.pref-idea-box{background:#f8f1de;border:1.5px solid #d9cba7;border-radius:6px}
.pref-idea-head b{font-family:var(--serif);font-size:15px;font-weight:400;letter-spacing:.5px;color:#3d4a5e}
.pref-idea-head small{font-size:11px;color:#7d7461}
.pref-idea-head button{
  border:1.5px solid var(--line);background:var(--card);border-radius:3px;
  color:var(--ink);width:24px;height:24px;box-shadow:1.5px 1.5px 0 var(--line);
}
.pref-idea-head button:hover{background:var(--gold)}
.pref-idea-card{
  background:var(--card);border:1.5px solid #cfc2a2;border-radius:4px;
  box-shadow:2px 2px 0 #1c2a4414;min-height:102px;
}
.pref-idea-card:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:3px 4px 0 #1c2a4424}
.pref-idea-card small{font-family:var(--serif);font-size:12.5px;letter-spacing:.6px;color:var(--rose)}
.pref-idea-card span{font-size:12.5px;line-height:1.7;color:#4a566b}
.pref-idea-card b{font-family:var(--serif);font-size:12px;color:#8a8271;font-weight:400}

/* ---------- 故事地图 / 时间轴 ---------- */
.map-board{background:var(--card);border:2px solid var(--line);border-radius:9px}
.map-board::before{display:none}
.map-heading span,.timeline-head span{font-family:var(--serif);font-size:12px;color:#5d6879;letter-spacing:.8px}
.map-root{
  background:#faf1da;border:2px solid var(--line);border-radius:5px;
  box-shadow:3px 3px 0 var(--line);color:var(--ink);
}
.map-root b{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.6px}
.map-root small{font-family:var(--serif);font-size:12px;color:#5d6879}
.map-root:hover,.map-node:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--line)}
.tree-stem,.map-node-wrap:before{background:#c3b795}
.map-nodes:before{background:#c3b795}
.map-node{
  background:var(--card);border:1.5px solid var(--line);border-radius:5px;
  box-shadow:2px 2px 0 #1c2a4418;min-height:96px;
}
.map-node.active{border-color:var(--rose);background:#fff5f2;box-shadow:3px 3px 0 #c23a3059}
.map-node .node-icon{border-radius:5px}
.map-node b{font-family:var(--serif);font-size:14px;font-weight:400;letter-spacing:.4px}
.map-node small{font-family:var(--serif);font-size:11.5px;color:#7d8798}
.map-bottom,.story-legend{font-family:var(--serif);font-size:11.5px;color:#8a8271;letter-spacing:.6px}
.focus-board{background:linear-gradient(150deg,#faf3e2,#fffaf0 72%);border:2px solid var(--line);border-radius:9px}
.focus-label{font-family:var(--serif);letter-spacing:1.2px;color:var(--sage);font-size:12.5px}
.focus-board h3{font-size:23px;margin:12px 0 9px}
.focus-board p{font-size:14.5px;line-height:1.9;color:#3f4a5e}
.focus-foot{border-top:1.5px solid #e4d8bc;font-family:var(--serif);font-size:12px;color:#5d6879;letter-spacing:.6px}
.focus-foot .btn{font-family:inherit;font-size:12.5px;font-weight:700}

.timeline-board{background:var(--card);border:2px solid var(--line);border-radius:9px}
.time-filter{border:1.5px solid var(--line);background:var(--gold);border-radius:3px;color:#3a2b12;padding:5px 10px}
.timeline:before{background:linear-gradient(#c9a99b,#d8cfb8 80%,transparent);width:2px}
.time-date{line-height:1.5}
.time-dot{background:var(--card);box-shadow:0 0 0 4px var(--card);border:2.5px solid var(--dot-color)}
.time-entry{background:var(--card);border:1.5px solid #e0d4b6;border-radius:5px;box-shadow:none}
.time-entry:hover{border-color:var(--line);transform:translateX(3px);box-shadow:3px 3px 0 #1c2a4418}
.time-entry summary b{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:.4px}
.time-entry summary .entry-kind{font-family:var(--serif);font-size:12px;letter-spacing:.6px}
.time-preview{font-family:var(--serif);font-size:13px;color:#7a8494;line-height:1.75}
.time-detail{border-top:1.5px solid #efe6d0;margin-top:12px;padding-top:11px}
.time-actions button{font-family:var(--serif);font-size:13px;color:var(--rose)}

/* ---------- 近期节点 ---------- */
.upcoming-panel{
  background:linear-gradient(135deg,#f8efdc,#f4f0e2);border:2px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);padding:20px 22px;
}
.upcoming-head small{letter-spacing:2px;color:var(--rose)}
.upcoming-head h2{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:.6px;margin:3px 0 0}
.upcoming-head>span{font-family:var(--serif);font-size:12.5px;color:#7d7461}
.upcoming-item{border-top:1.5px solid #e0d4b6;padding:13px 0}
.upcoming-date b{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--rose)}
.upcoming-copy strong{font-size:18px}
.upcoming-copy p{font-size:13.5px;color:#4a566b}
.upcoming-copy em{font-family:var(--serif);font-size:12.5px;font-style:normal;color:var(--rose)}
.upcoming-icon{border-radius:5px;color:#7d8798;font-size:15px}
.upcoming-icon:hover{background:#eee3c6;color:var(--ink)}
.upcoming-icon.delete-icon:hover{background:#f7e2dd;color:var(--rose)}
.upcoming-edit{font-family:var(--serif);font-size:12.5px;color:#7d7461}
.upcoming-item>.btn{font-size:13px;padding:8px 13px}
.upcoming-empty{font-family:var(--serif);font-size:13px;color:#7d7461}
.upcoming-tools{gap:2px}

/* ---------- 列表条目 ---------- */
.entry{padding:18px 20px}
.entry p{margin:0 0 9px}
.entry-meta{letter-spacing:.6px}
.entry-actions{gap:4px}
.cards{gap:16px}
.done h3{color:#9aa3b0;text-decoration-thickness:1.5px}
.check{accent-color:var(--sage);width:16px;height:16px}

/* ---------- 弹层 / 表单 ---------- */
.modal-back{background:#20201f8c}
.modal{
  border:2px solid var(--line);border-radius:9px;box-shadow:9px 10px 0 #1c2a4440;
  padding:24px 26px;
}
.modal-head{border-bottom:1.5px solid #e4d8bc;padding-bottom:14px;margin-bottom:18px}
.x{color:#7d8798;font-size:22px}
.x:hover{color:var(--rose)}
.field label{font-family:var(--serif);font-size:13px;letter-spacing:.7px;color:#4a566b}
.field input,.field textarea,.field select{
  border:1.5px solid var(--line);border-radius:4px;background:#fffdf6;
  font-family:var(--serif);font-size:15px;color:var(--ink);padding:9px 11px;
}
.field textarea{line-height:1.85}
.checkline{font-family:var(--serif);font-size:12.5px;color:#5d6879;letter-spacing:.5px}
.form-note{line-height:1.7}
.modal-foot{border-top:1.5px solid #e4d8bc;padding-top:16px;margin-top:19px}

.toast{
  background:var(--ink);color:#fffaf0;border-radius:4px;
  font-family:var(--serif);font-size:14px;letter-spacing:.8px;
  padding:9px 17px;box-shadow:4px 4px 0 #1c2a4433;
}

/* ---------- 纪念日 ---------- */
.anniversary{
  background:var(--gold);border:2px solid var(--line);border-radius:7px;
  box-shadow:var(--shadow);
}
.anniversary h3{font-size:21px;margin:8px 0 4px}
.anniversary p{font-size:13px;color:#4a3a14}
.days{border-top:1.5px solid #c9a552;margin-top:13px;padding-top:11px;color:#5c4712}
.days b{font-family:'DM Sans',sans-serif;font-weight:700;font-size:29px;color:#3a2b12}

.pref-row{border-top:1px solid #efe6d0;padding:10px 0}
.pref-icon{background:var(--sage-soft);border:1.5px solid #b8d4c9;border-radius:5px;width:32px;height:32px}
.pref-row b{font-family:var(--serif);font-size:14.5px;font-weight:400;letter-spacing:.5px}
.pref-row small{font-size:12px;color:#5d6879}
.quick button{
  font-family:var(--serif);font-size:13px;letter-spacing:.5px;
  background:var(--card);border:1.5px dashed #c3b795;border-radius:5px;
  color:#4a566b;padding:13px 8px;transition:border-color .16s,background .16s;
}
.quick button:hover{border-style:solid;border-color:var(--line);background:#fffdf5;color:var(--ink)}
.quick button span{font-size:19px;margin-bottom:6px}

/* 侧栏引用与卷首细节 */
.memory h3{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:.4px}
.memory p{font-size:13px;line-height:1.8;color:#4a566b;font-family:var(--serif)}
.datebox{background:#f5eddb;border:1.5px solid #ddd0b2;border-radius:4px;color:#6b7488}
.datebox b{font-family:'DM Sans',sans-serif;font-weight:700;font-size:17px;color:var(--ink)}
.datebox small{font-family:var(--serif);font-size:11px}

/* ---------- 滚动条 ---------- */
*{scrollbar-width:thin;scrollbar-color:#c3b795 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9bd9c;border:2px solid var(--paper);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#b8a982}

/* ---------- 字体定稿：全站衬线，靠字重与字号拉层级 ---------- */
body{font-family:var(--serif);font-size:16px;line-height:1.7;font-weight:400;color:var(--ink)}
button,input,textarea,select{font-family:var(--serif)}

.brand strong{font:700 22px/1.3 var(--serif);letter-spacing:.1em;color:var(--ink)}
.brand small{font:500 11px/1.4 var(--serif);letter-spacing:.2em;color:#6b7385}
.brandmark{font:700 18px/1 var(--serif)}

.nav-label{font:700 11px/1.4 var(--serif);letter-spacing:.22em;color:#33425c}
.nav button{font:700 18px/1.3 var(--serif);letter-spacing:.03em;padding:11px 13px;border-radius:8px}
.nav button.active{font-weight:700}

.quote{font:400 13px/1.9 var(--serif);color:#5f6a7d}
.local-note{font:400 11px/1.75 var(--serif)}
.sidebar-utility button{font:500 11.5px/1.4 var(--serif)}
.sidebar-idea-head small{font:700 12px/1.4 var(--serif);letter-spacing:.08em}
.sidebar-idea p{font:400 15px/1.7 var(--serif);color:#3a2b12}
.sidebar-idea-action{font:700 14px/1.4 var(--serif)}

.crumb{font:600 13.5px/1.5 var(--serif);letter-spacing:.04em;color:#5a6579}
.hero h1,.section-title h1,.memory-home-head h1{font:700 clamp(32px,3.2vw,40px)/1.3 var(--serif);letter-spacing:.02em}
.hero p,.section-title p,.memory-home-head span{font:400 14.5px/1.75 var(--serif);color:var(--muted)}
.eyebrow{font:700 11px/1.4 var(--serif);letter-spacing:.2em;color:var(--rose)}
.datepill{font:600 14px/1.4 var(--serif);letter-spacing:.02em}

.panel h2,.memory-gallery-head h2,.timeline-head h2,.map-heading h2{font:700 21px/1.4 var(--serif);letter-spacing:.02em}
.panel-head small,.memory-gallery-head small{font:500 12px/1.4 var(--serif);letter-spacing:.04em;color:#5d6879}
.entry h3,.pref-card h3,.memory-card h3{font:700 20px/1.5 var(--serif);letter-spacing:.01em}
.memory-card p,.entry p,.pref-card p,.upcoming-copy p,.anniversary p,.pref-note p,
.timeline-empty,.pref-empty,.empty,.memory-empty{font:400 15.5px/1.8 var(--serif);color:#3f4a5e}
.memory-full,.time-detail,.memory-view-copy p{font:400 16px/1.9 var(--serif);color:#33405a}
.memory-card-meta,.entry-meta{font:500 12.5px/1.5 var(--serif);letter-spacing:.04em;color:#5d6879}
.source,.anniversary .label,.upcoming-copy small,.upcoming-date small,

.memory-card details summary{font:600 14px/1.4 var(--serif);color:var(--rose)}

.btn{font:700 15px/1.2 var(--serif);letter-spacing:.02em;border-radius:7px}
.btn.small{font:700 13.5px/1.2 var(--serif)}
.linkbtn{font:700 13.5px/1.4 var(--serif)}
.tag,.tag.sage,.tag.gold{font:600 13px/1.4 var(--serif);letter-spacing:.02em;border-radius:4px}
.secret{font:700 12px/1.4 var(--serif);letter-spacing:.06em}
.mood{font-size:18px}

.stat span{font:500 13px/1.4 var(--serif);letter-spacing:.04em}
.stat b{font:700 30px/1 var(--serif);letter-spacing:.01em}

.modal-head h2{font:700 23px/1.4 var(--serif)}
.memory-view-copy h2{font:700 27px/1.35 var(--serif)}
.memory-view-copy small{font:500 13px/1.4 var(--serif)}
.featured-copy h2{font:700 32px/1.3 var(--serif);letter-spacing:.01em}
.featured-kicker{font:700 12px/1.4 var(--serif);letter-spacing:.14em}
.field label{font:600 13px/1.4 var(--serif);letter-spacing:.04em}
.field input,.field textarea,.field select{font:400 15.5px/1.7 var(--serif)}
.checkline{font:500 13.5px/1.6 var(--serif)}
.toast{font:600 14px/1.4 var(--serif)}

<body data-page-node-id="x46xZUs0aJrt30K2fiNvsT"><div id="app" data-page-node-id="VsgnDpbRs7J7dcCDne4Wko"></div><script>
const KEY='womenzhijian-v1';const today=new Date();const iso=d=>new Date(d).toISOString().slice(0,10);const sample={entries:[],anniversaryDate:''};let photoDBPromise=null;const photoUrlCache=new Map();let db=load();let page='home',searchTerm='',filter='全部',modal=null,editId=null,storyFilter='all',memoryMonth='全部月份',memoryCategory='全部类型',memoryView='album';let lastFocusedElement=null;function load(){try{return {...sample,...JSON.parse(localStorage.getItem(KEY)||'{}'),entries:JSON.parse(localStorage.getItem(KEY)||'{}').entries||sample.entries}}catch{return structuredClone(sample)}}function openPhotoDB(){if(photoDBPromise)return photoDBPromise;photoDBPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('wzj-photo-store',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return photoDBPromise}
function photoRequest(mode,action){return openPhotoDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction('photos',mode),store=tx.objectStore('photos');let req;try{req=action(store)}catch(err){reject(err);return}if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}else{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)}}))}

function getPhotoBlob(id){return photoRequest('readonly',store=>store.get(id)).then(row=>row?.blob||null)}
function photoBlobFromDataUrl(url){return fetch(url).then(r=>r.blob())}
function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function migrateLegacyPhotos(){await openPhotoDB();let changed=false;for(const x of db.entries||[]){const legacy=Array.isArray(x.photos)?x.photos:(x.photo?[x.photo]:[]);if(!legacy.length)continue;x.photoIds=Array.isArray(x.photoIds)?x.photoIds:[];for(const src of legacy){if(typeof src==='string'&&src.startsWith('data:')){const id=crypto.randomUUID(),blob=await photoBlobFromDataUrl(src);await putPhotoBlob(id,blob);photoUrlCache.set(id,URL.createObjectURL(blob));x.photoIds.push(id)}}delete x.photos;delete x.photo;changed=true}if(changed)localStorage.setItem(KEY,JSON.stringify(db))}
async function loadPhotoCache(){const ids=[...new Set((db.entries||[]).flatMap(x=>x.photoIds||[]))];for(const id of ids){if(photoUrlCache.has(id))continue;const blob=await getPhotoBlob(id);if(blob)photoUrlCache.set(id,URL.createObjectURL(blob))}}
async function removeUnusedPhotos(){const alive=new Set((db.entries||[]).flatMap(x=>x.photoIds||[]));const all=await photoRequest('readonly',store=>store.getAllKeys());for(const id of all){if(!alive.has(id)){await photoRequest('readwrite',store=>store.delete(id));const url=photoUrlCache.get(id);if(url)URL.revokeObjectURL(url);photoUrlCache.delete(id)}}}
