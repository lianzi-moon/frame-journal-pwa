<title>帧藏</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap');
:root{--paper:#f7f4ee;--card:#fffefa;--ink:#34372f;--muted:#818277;--line:#e9e4da;--rose:#ba786c;--rose-soft:#f4e7e1;--sage:#77836d;--sage-soft:#e9ede4;--gold:#c3a66e;--shadow:0 12px 40px #51432b0d}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(138deg,#f4eee9 0%,#faf7f1 45%,#eff2eb 100%);color:var(--ink);font-family:'DM Sans','Noto Serif SC',sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.cloud-divider{text-align:center;color:var(--muted);font-size:12px;margin:12px 0}
.cloud-note{font-size:12px;line-height:1.7;color:var(--muted);margin-top:12px}
.cloud-message{font-size:13px;line-height:1.7;color:var(--rose);overflow-wrap:anywhere}
.install-hint{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);width:min(440px,calc(100% - 28px));padding:17px 18px;background:var(--card);border:2px solid var(--ink);box-shadow:5px 6px 0 #1c2a442b;color:var(--ink)}
.install-hint b{display:block;font:500 17px 'Noto Serif SC',serif;margin-bottom:6px}
.install-hint p{font:14px/1.7 'Noto Serif SC',serif;margin:0 0 12px}
.install-hint-actions{display:flex;justify-content:flex-end;gap:8px}

.app{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh;width:100%;overflow-x:hidden}
.sidebar{padding:34px 20px 24px 28px;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 46px 5px}
.brandmark{width:38px;height:38px;border-radius:13px;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center;font-size:20px}
.brand strong{font:600 18px 'Noto Serif SC',serif;letter-spacing:1px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-top:4px}
.nav-label{font-size:10px;color:#a5a394;letter-spacing:1.7px;margin:0 0 10px 13px}
.nav{display:grid;gap:5px}
.nav button{border:0;text-align:left;background:transparent;color:#74766d;border-radius:12px;padding:11px 13px;font-size:13px;display:flex;align-items:center;gap:12px;transition:.18s}
.nav button:hover{background:#efebe3}
.nav button.active{background:var(--rose-soft);color:#985d52;font-weight:600}
.nav .ico{width:19px;text-align:center;font-size:16px}
.nav .ico svg{display:block;width:23px;height:23px}
.side-bottom{margin-top:auto}
.quote{border-top:1px solid var(--line);padding:20px 9px 0;color:#8d8c81;font:13px/1.8 'Noto Serif SC',serif}
.quote span{color:var(--rose)}
.local-note{font-size:10px;color:#a5a394;margin:20px 8px 0;line-height:1.7}
.main{max-width:1240px;min-width:0;width:100%;margin:0 auto;padding:34px 54px 70px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:31px}
.crumb{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:9px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 15px;border-radius:11px;font-size:12px;transition:.18s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:white}
.btn.small{padding:7px 11px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:27px}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--rose);text-transform:uppercase}
.hero h1{font:500 clamp(28px,3vw,38px) 'Noto Serif SC',serif;letter-spacing:1px;margin:9px 0 8px}
.hero p{margin:0;color:var(--muted);font-size:13px}
.datepill{color:#8e887a;background:#eee9df;border-radius:20px;padding:9px 14px;font-size:11px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:23px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
.stat span{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}
.stat b{font:500 25px 'Noto Serif SC',serif}
.stat i{font-style:normal;width:37px;height:37px;display:grid;place-items:center;border-radius:13px;background:var(--rose-soft);color:var(--rose)}
.stat:nth-child(2) i{background:var(--sage-soft);color:var(--sage)}
.stat:nth-child(3) i{background:#f3eee1;color:var(--gold)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.9fr);gap:17px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px 22px;box-shadow:0 3px 15px #51432b05}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}
.panel h2{font:500 17px 'Noto Serif SC',serif;margin:0}
.panel-head small{font-size:10px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--rose);font-size:11px;padding:5px}
.memory{display:grid;grid-template-columns:48px 1fr;gap:13px;padding:13px 0;border-top:1px solid #f0ece4}
.memory:first-child{border-top:0}
.datebox{text-align:center;background:#f7f3ec;border-radius:10px;padding:7px 3px;height:50px;color:#918b7d}
.datebox b{display:block;font-size:17px;font-weight:500;color:#5d5e55}
.datebox small{font-size:9px}
.memory h3{font:500 14px 'Noto Serif SC',serif;margin:1px 0 5px}
.memory p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{display:inline-block;border-radius:20px;padding:4px 8px;font-size:9px;background:var(--rose-soft);color:#9c6258}
.tag.sage{background:var(--sage-soft);color:#65725d}
.tag.gold{background:#f3eee1;color:#967e4e}
.rightcol{display:grid;align-content:start;gap:15px}
.anniversary{background:#f3ede0;border:1px solid #e8dfcc;border-radius:15px;padding:17px}
.anniversary .label{font-size:10px;color:#958560;letter-spacing:1px}
.anniversary h3{font:500 15px 'Noto Serif SC',serif;margin:9px 0 4px}
.anniversary p{font-size:11px;color:#8d897e;margin:0}
.days{margin-top:14px;border-top:1px solid #e4dac5;padding-top:11px;display:flex;align-items:baseline;gap:6px;color:#8b7954}
.days b{font:500 26px 'Noto Serif SC',serif}
.pref-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid #f0ece4}
.pref-row:first-of-type{border:0}
.pref-icon{width:32px;height:32px;border-radius:11px;background:var(--sage-soft);display:grid;place-items:center}
.pref-row b{font-size:11px;font-weight:600}
.pref-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}
.quick button{background:var(--card);border:1px dashed #dcd5c9;border-radius:13px;padding:14px 8px;color:#707268;font-size:10px}
.quick button span{display:block;font-size:18px;margin-bottom:7px}
.section-title{display:flex;justify-content:space-between;align-items:flex-end;margin:7px 0 20px}
.section-title h1{font:500 30px 'Noto Serif SC',serif;margin:7px 0}
.section-title p{color:var(--muted);font-size:12px;margin:0}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:16px}
.search{flex:1;max-width:370px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 13px;font-size:12px;outline:none}
.search:focus,input:focus,textarea:focus,select:focus{border-color:#cda39a!important;box-shadow:0 0 0 3px #ba786c16}
.filter{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;color:#77786e;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;position:relative}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start}
.entry h3{font:500 15px 'Noto Serif SC',serif;margin:1px 0 8px}
.entry p{font-size:11px;color:var(--muted);line-height:1.8;margin:0 0 9px;white-space:pre-wrap}
.entry-meta{font-size:10px;color:#99978d}
.entry-actions{display:flex;gap:2px}
.entry-actions button{border:0;background:none;color:#aaa99e;font-size:12px;padding:4px}
.entry-actions button:hover{color:var(--rose)}
.empty{grid-column:1/-1;text-align:center;padding:54px 20px;background:var(--card);border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:12px}
.empty b{display:block;font:500 16px 'Noto Serif SC',serif;color:var(--ink);margin:8px}
.wish{display:flex;gap:12px;align-items:flex-start}
.check{accent-color:var(--sage);margin-top:3px}
.done h3{text-decoration:line-through;color:#aaa}
.mood{font-size:18px;margin-right:5px}
.secret{font-size:9px;border-radius:20px;background:#eeeaf2;color:#81738b;padding:4px 8px}
.pref-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.pref-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px}
.pref-card .pref-symbol{font-size:20px;margin-bottom:10px}
.pref-card h3{font:500 14px 'Noto Serif SC',serif;margin:0 0 9px}
.pref-card p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}
.pref-card .source{font-size:9px;color:#aaa79a;margin-top:11px}
.modal-back{position:fixed;inset:0;background:#28251f77;display:grid;place-items:center;padding:18px;z-index:5}
.modal{width:min(520px,100%);background:var(--card);border-radius:18px;padding:23px 25px;box-shadow:0 25px 80px #1e1a1640;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{font:500 19px 'Noto Serif SC',serif;margin:0}
.x{border:0;background:none;color:#929187;font-size:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;color:#77786e}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fffefa;outline:none;font-size:12px;color:var(--ink)}
.field textarea{min-height:83px;resize:vertical}
.checkline{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#36382f;color:#fff;padding:10px 17px;border-radius:24px;font-size:11px;z-index:9;box-shadow:var(--shadow)}
.mobile-head{display:none}

.idea-strip{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:13px;border:1px solid #e9dfcd;border-radius:16px;padding:15px 17px;margin:0 0 16px;background:linear-gradient(110deg,#f5f0e3,#fbf7ef 62%,#f9eeea);transition:opacity .25s}
.idea-icon{width:38px;height:38px;border-radius:13px;background:#fffaf0;color:#ae9361;display:grid;place-items:center;font-size:17px}
.idea-copy small{display:block;color:#a18b61;font-size:9px;letter-spacing:1px;margin-bottom:5px}
.idea-copy b{display:block;font:500 13px 'Noto Serif SC',serif;line-height:1.6;color:#55564e}
.idea-actions{display:flex;gap:7px;align-items:center}
.idea-actions .btn{font-size:10px;padding:8px 11px;white-space:nowrap}
.idea-refresh{border:0;background:transparent;color:#8b887b;font-size:10px;padding:7px;white-space:nowrap}
.idea-refresh:hover{color:var(--rose)}
.pref-idea-box{min-width:0;max-width:100%;margin:0 0 14px;padding:12px 13px;border-radius:14px;background:#faf8f1;border:1px solid #ebe7dc}
.pref-idea-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pref-idea-head b{display:block;font:500 11px 'Noto Serif SC',serif;color:#5f6258}
.pref-idea-head small{display:block;font-size:9px;color:#9a998e;margin-top:4px}
.pref-idea-head button{width:25px;height:25px;border:1px solid #e8e3d8;border-radius:50%;background:#fffefa;color:#8b887d;margin-left:4px;font-size:16px;line-height:1}
.pref-idea-track{width:100%;max-width:100%;min-width:0;display:flex;gap:9px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:1px 1px 8px;scrollbar-width:thin;scrollbar-color:#d9d5c8 transparent}
.pref-idea-card{flex:0 0 190px;min-height:104px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;padding:11px 12px;border:1px solid #ebe7dc;border-radius:12px;background:#fffefa;scroll-snap-align:start;cursor:pointer;transition:.18s}
.pref-idea-card:hover{transform:translateY(-2px);border-color:#d7c9b5}
.pref-idea-card small{font-size:9px;color:#a3895f}
.pref-idea-card span{font-size:10px;line-height:1.55;color:#67695f;flex:1}
.pref-idea-card b{font-size:9px;font-weight:500;color:#9d6a5f}
.preference-wall{margin:0 0 17px;padding:18px 20px 20px;background:#f3f5ee;border:1px solid #e2e6da;border-radius:18px}
.wall-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.wall-heading h2{font:500 16px 'Noto Serif SC',serif;margin:0}
.wall-heading p{color:var(--muted);font-size:10px;margin:5px 0 0}
.wall-heading .btn{font-size:10px;padding:8px 11px}
.preference-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pref-note{position:relative;background:#fffefa;border:1px solid #e8e7de;border-radius:14px;padding:15px 16px;min-height:105px;box-shadow:0 5px 15px #45493208}
.pref-note:before{content:'"';position:absolute;right:12px;top:2px;color:#d8dfd0;font:32px Georgia,serif}
.pref-note h3{font:500 12px 'Noto Serif SC',serif;margin:0 25px 7px 0}
.pref-note p{font-size:10px;line-height:1.7;color:#77796f;margin:0;white-space:pre-wrap}
.pref-note .note-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:9px;color:#aaa99c}
.pref-note .note-actions{display:flex;gap:8px}
.pref-note .note-actions button{border:0;background:none;color:#a19f91;font-size:10px;padding:0}
.pref-note .note-actions button:hover{color:var(--rose)}
.pref-empty{padding:18px;background:#fffefa;border:1px dashed #d5dacd;border-radius:12px;color:#8a8c80;font-size:10px;line-height:1.7}
.pref-empty button{border:0;background:none;color:var(--sage);padding:0;font:inherit;text-decoration:underline;cursor:pointer}
.sidebar-idea{margin:25px 2px 0;padding:15px 14px 14px;border:1px solid #e9dfcd;border-radius:15px;background:linear-gradient(145deg,#f5f0e3,#fbf7ef 65%,#f9eeea)}
.sidebar-idea-head{display:flex;align-items:center;gap:7px;color:#a18b61}
.sidebar-idea-head span{font-size:15px}
.sidebar-idea-head small{font-size:9px;letter-spacing:.8px;flex:1}
.sidebar-idea-head button{border:0;background:transparent;color:#918d80;padding:3px;font-size:13px}
.sidebar-idea p{font:500 11px/1.75 'Noto Serif SC',serif;color:#5b5b52;margin:10px 0 12px}
.sidebar-idea-action{border:0;background:transparent;color:#9f6a5e;font-size:10px;padding:0}
.sidebar-idea-action:hover{text-decoration:underline}
.story-map{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(265px,.75fr);gap:16px;margin-bottom:17px}
.map-board,.focus-board,.timeline-board{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.map-board{padding:23px 25px 25px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 8%,#fbf5ee 0,transparent 57%),var(--card)}
.map-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.map-heading h2,.timeline-head h2{font:500 17px 'Noto Serif SC',serif;margin:0}
.map-heading span,.timeline-head span{font-size:10px;color:var(--muted)}
.map-root{position:relative;z-index:1;border:1px solid #e6d6ce;background:linear-gradient(135deg,#fffaf6,#f8eee7);border-radius:17px;width:min(245px,80%);margin:12px auto 0;padding:14px 16px;text-align:center;color:var(--ink);box-shadow:0 7px 22px #9b6d5e12}
.map-root:hover,.map-node:hover{transform:translateY(-2px);box-shadow:0 10px 25px #63544014}
.map-root b{display:block;font:500 16px 'Noto Serif SC',serif}
.map-root small{display:block;font-size:10px;color:var(--muted);margin-top:5px}
.tree-stem{height:20px;width:1px;background:#d9c7ba;margin:auto}
.map-nodes{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.map-nodes:before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:#d9c7ba}
.map-node-wrap{position:relative;padding-top:15px}
.map-node-wrap:before{content:"";position:absolute;top:0;left:50%;height:15px;width:1px;background:#d9c7ba}
.map-node{display:flex;width:100%;min-height:97px;flex-direction:column;justify-content:center;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;background:#fffefa;color:var(--ink);transition:.2s;padding:10px 5px}
.map-node.active{border-color:#d2a89c;background:#fff8f4;box-shadow:0 5px 18px #ba786c19}
.map-node .node-icon{width:27px;height:27px;border-radius:10px;display:grid;place-items:center;background:var(--node-bg);color:var(--node-color);font-size:14px}
.map-node b{font:500 11px 'Noto Serif SC',serif;white-space:nowrap}
.map-node small{font-size:9px;color:var(--muted)}
.focus-board{padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fbf8f1,#fffefa 70%)}
.focus-top{display:flex;justify-content:space-between;align-items:center}
.focus-label{font-size:10px;color:var(--sage);letter-spacing:1px}
.focus-board h3{font:500 19px 'Noto Serif SC',serif;margin:13px 0 8px}
.focus-board p{font-size:11px;line-height:1.8;color:var(--muted);margin:0;white-space:pre-wrap}
.focus-foot{border-top:1px solid var(--line);margin-top:17px;padding-top:13px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}
.focus-foot .btn{font-size:10px;padding:8px 11px}
.timeline-board{padding:22px 25px}
.timeline-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.time-filter{font-size:10px;color:#89887c;background:#f3f0e8;border-radius:20px;padding:6px 10px}
.timeline{position:relative;padding:5px 0 0}
.timeline:before{content:"";position:absolute;left:69px;top:12px;bottom:18px;width:1px;background:linear-gradient(#d6b8aa,#e8e1d7 80%,transparent)}
.time-row{position:relative;display:grid;grid-template-columns:55px 1fr;gap:29px;padding:10px 0}
.time-date{text-align:right;padding-top:11px;color:#858478;font-size:9px;line-height:1.5}
.time-dot{position:absolute;left:64px;top:22px;width:11px;height:11px;border-radius:50%;background:#fffefa;border:2px solid var(--dot-color);box-shadow:0 0 0 4px var(--dot-halo);z-index:1}
.time-entry{border:1px solid #eee9e1;border-radius:13px;background:#fffefa;padding:12px 14px;transition:.18s}
.time-entry:hover{border-color:#dfd3c5;transform:translateX(2px)}
.time-entry summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.time-entry summary::-webkit-details-marker{display:none}
.time-entry summary b{font:500 13px 'Noto Serif SC',serif}
.time-entry summary .entry-kind{font-size:9px;color:var(--dot-color);white-space:nowrap}
.time-entry summary .summary-title:after{content:'＋';font:12px sans-serif;color:#aaa79c;margin-left:9px}

function cloudPanelContent(){if(!window.supabase?.createClient)return `<p>云端组件还没有加载成功，请确认网络可以访问 Supabase 后刷新。</p>`;if(!cloudSession)return `<p>可以使用邮箱登录，也可以免邮箱创建临时账号后输入邀请码加入。</p><form onsubmit="sendCloudLink(event)"><div class="field full"><label>邮箱登录（可选）</label><input name="email" type="email" required placeholder="name@example.com" autocomplete="email"></div><button class="btn" type="submit">发送登录链接</button></form><div class="cloud-divider">或</div><button class="btn primary" style="width:100%" onclick="signInAnonymously()">免邮箱继续（匿名加入）</button><p class="cloud-note">匿名账号不会要求填写邮箱；请在当前设备完成加入。清除浏览器数据或更换设备后，匿名账号可能无法找回。</p>${cloudMessage?`<p class="cloud-message">${escape(cloudMessage)}</p>`:''}`;const accountLabel=cloudSession.user.is_anonymous?'匿名账号（当前设备）':(cloudSession.user.email||'已登录');if(!cloudSpaceId)return `<p>当前身份：${escape(accountLabel)}</p><div class="cloud-space-actions"><form onsubmit="createCloudSpace(event)"><label>新建你们的空间</label><input name="name" value="帧藏" maxlength="40"><button class="btn primary" type="submit">创建空间并同步这台设备的记录</button></form><form onsubmit="joinCloudSpace(event)"><label>加入伴侣创建的空间</label><input name="code" required maxlength="16" placeholder="输入对方的邀请码"><button class="btn" type="submit">输入邀请码并加入</button></form></div>${cloudMessage?`<p class="cloud-message">${escape(cloudMessage)}</p>`:''}<p class="cloud-note">加入时会把本机尚未同步的记录合并进空间；重名记录以云端版本为准。</p>`;return `<p>当前身份：${escape(accountLabel)}</p><div class="cloud-space-status"><b>${escape(cloudSpaceInfo?.name||'你们的共享空间')}</b><span>记录会同步到云端</span><label>邀请伴侣使用此代码</label><code>${escape(cloudSpaceInfo?.invite_code||'')}</code><button class="btn" onclick="copyCloudInvite()">复制邀请码</button></div><button class="cloud-signout" onclick="signOutCloud()">退出登录</button>${cloudMessage?`<p class="cloud-message">${escape(cloudMessage)}</p>`:''}`}
function openCloudPanel(){document.querySelector('.cloud-back')?.remove();const el=document.createElement('div');el.className='modal-back cloud-back';el.onclick=e=>{if(e.target===el)el.remove()};el.innerHTML=`<div class="modal cloud-modal"><div class="modal-head"><h2>云同步与共享空间</h2><button class="x" onclick="this.closest('.cloud-back').remove()" aria-label="关闭">×</button></div><div class="cloud-panel-content">${cloudPanelContent()}</div></div>`;document.body.append(el);el.querySelector('input')?.focus()}
async function sendCloudLink(e){e.preventDefault();try{const email=new FormData(e.target).get('email').trim(),client=cloudClient();const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)throw error;cloudMessage='登录链接已发送，请在邮箱中打开；如果链接无法返回本页，需要在 Supabase Auth 的 Redirect URLs 添加当前网页地址。';openCloudPanel()}catch(err){cloudMessage=humanCloudError(err,'登录邮件发送失败');openCloudPanel()}}
async function signInAnonymously(){try{const {data,error}=await cloudClient().auth.signInAnonymously();if(error)throw error;cloudSession=data.session;cloudMessage='匿名账号已创建。现在输入伴侣的邀请码即可加入共享空间。';openCloudPanel()}catch(err){console.error(err);cloudMessage=humanCloudError(err,'匿名加入暂不可用');openCloudPanel()}}
function humanCloudError(err,fallback='操作失败'){const raw=String(err?.message||err?.details||fallback),m=raw.toLowerCase();if(/anonymous.*(disabled|not enabled)|anonymous sign-ins are disabled/.test(m))return 'Supabase 尚未启用匿名登录：请在项目 Authentication → Sign In / Providers 中开启 Anonymous。';if(/full|capacity|limit|maximum.*member|member.*limit|seat/.test(m))return '这个共享空间已达到成员上限，请让空间创建者检查成员名额。';if(/invite|invalid.*code|not found/.test(m))return '邀请码无效或已失效，请核对对方分享的完整邀请码。';if(/network|fetch/.test(m))return '网络连接失败，请检查网络后重试。';return raw||fallback}
function makeInviteCode(){const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);return [...bytes].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
async function createCloudSpace(e){e.preventDefault();try{const name=new FormData(e.target).get('name')||'帧藏',code=makeInviteCode(),{data,error}=await cloudClient().rpc('create_couple_space',{p_name:name,p_invite_code:code});if(error)throw error;const row=Array.isArray(data)?data[0]:data;await activateCloudSpace(row.space_id);cloudMessage='空间已创建。把邀请码发给伴侣，对方登录后选择加入即可。';openCloudPanel();requestCloudSync()}catch(err){cloudMessage=humanCloudError(err,'创建空间失败');openCloudPanel()}}
async function joinCloudSpace(e){e.preventDefault();try{const code=String(new FormData(e.target).get('code')||'').trim().toUpperCase(),{data,error}=await cloudClient().rpc('join_couple_space',{p_invite_code:code});if(error)throw error;await activateCloudSpace(data);cloudMessage='已加入共享空间，正在合并这台设备的记录。';openCloudPanel();requestCloudSync()}catch(err){cloudMessage=humanCloudError(err,'邀请码无效或加入失败');openCloudPanel()}}
async function activateCloudSpace(id){cloudSpaceId=id;localStorage.setItem('wzj-cloud-space',id);localStorage.setItem('wzj-cloud-enabled','1');const {data,error}=await cloudClient().from('couple_spaces').select('id,name,invite_code').eq('id',id).single();if(error)throw error;cloudSpaceInfo=data;startCloudRealtime();render()}
async function loadCloudSpace(){if(!cloudSession)return;try{const {data,error}=await cloudClient().from('space_members').select('space_id').eq('user_id',cloudSession.user.id).limit(1).maybeSingle();if(error)throw error;if(!data){cloudSpaceId='';cloudSpaceInfo=null;localStorage.removeItem('wzj-cloud-space');render();return}await activateCloudSpace(data.space_id);await requestCloudSync()}catch(err){console.error(err);cloudMessage=err.message||'共享空间读取失败';render()}}
function startCloudRealtime(){if(!cloudSession||!cloudSpaceId)return;const c=cloudClient();if(cloudRealtime)c.removeChannel(cloudRealtime);cloudRealtime=c.channel('couple-entries-'+cloudSpaceId).on('postgres_changes',{event:'*',schema:'public',table:'couple_entries',filter:'space_id=eq.'+cloudSpaceId},()=>requestCloudSync()).subscribe()}
async function uploadEntryPhotos(entry){for(const id of entry.photoIds||[]){const blob=await getPhotoBlob(id);if(!blob)continue;const path=`${cloudSpaceId}/${entry.id}/${id}.jpg`,{error}=await cloudClient().storage.from('couple-photos').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(error)throw error}}
async function hydrateCloudEntry(entry,updatedAt,ownerId,visibility){const copy={...entry,_updatedAt:updatedAt,_ownerId:ownerId,private:visibility==='private'};for(const id of copy.photoIds||[]){if(photoUrlCache.has(id))continue;const path=`${cloudSpaceId}/${copy.id}/${id}.jpg`,{data,error}=await cloudClient().storage.from('couple-photos').download(path);if(!error&&data){await putPhotoBlob(id,data);photoUrlCache.set(id,URL.createObjectURL(data))}}return copy}
async function syncCloudNow(){if(!cloudSession||!cloudSpaceId||cloudApplying)return;const client=cloudClient(),uid=cloudSession.user.id;const {data:remoteRows,error}=await client.from('couple_entries').select('id,type,payload,is_deleted,updated_at,owner_id,visibility').eq('space_id',cloudSpaceId);if(error)throw error;const remote=new Map((remoteRows||[]).map(row=>[row.id,row]));db._deletedEntryTimes=db._deletedEntryTimes||{};db._deletedEntryMeta=db._deletedEntryMeta||{};let changed=false;const push=[];const demoIds=new Set(['m1','m2','r1','p1','p2','p3','w1','a1']);for(const entry of db.entries){if(demoIds.has(entry.id)&&!remote.has(entry.id)){entry.id=crypto.randomUUID();changed=true}}for(const row of remoteRows||[]){const local=db.entries.find(x=>x.id===row.id),localTime=Date.parse(local?._updatedAt||0)||0,remoteTime=Date.parse(row.updated_at)||0,localDelete=Date.parse(db._deletedEntryTimes[row.id]||0)||0;if(row.is_deleted){if(local&&localTime>remoteTime){continue}if(local){db.entries=db.entries.filter(x=>x.id!==row.id);changed=true}if(localDelete<remoteTime){db._deletedEntryTimes[row.id]=row.updated_at;db._deletedEntryMeta=db._deletedEntryMeta||{};db._deletedEntryMeta[row.id]={type:row.type,owner_id:row.owner_id,visibility:row.visibility};changed=true}continue}if(localDelete>=remoteTime&&localDelete){continue}if(local&&localTime>remoteTime)continue;const next=await hydrateCloudEntry(row.payload||{},row.updated_at,row.owner_id,row.visibility);const index=db.entries.findIndex(x=>x.id===row.id);if(index<0){db.entries.unshift(next);changed=true}else if(localTime!==remoteTime){db.entries[index]=next;changed=true}}
for(const entry of db.entries){const row=remote.get(entry.id),remoteTime=Date.parse(row?.updated_at||0)||0,localTime=Date.parse(entry._updatedAt||0)||0,deletedAt=Date.parse(db._deletedEntryTimes[entry.id]||0)||0;if(deletedAt>localTime)continue;if(!row||(!row.is_deleted&&localTime>remoteTime)||(row.is_deleted&&localTime>remoteTime)){if(!entry._updatedAt)entry._updatedAt=new Date().toISOString();await uploadEntryPhotos(entry);const privateEntry=entry.type==='reflection'&&entry.private!==false;entry._ownerId=privateEntry?uid:(entry._ownerId||uid);push.push({space_id:cloudSpaceId,id:entry.id,type:entry.type,payload:entry,is_deleted:false,owner_id:entry._ownerId,visibility:privateEntry?'private':'shared',updated_at:entry._updatedAt,updated_by:uid});changed=true}}
for(const [id,stamp] of Object.entries(db._deletedEntryTimes)){const row=remote.get(id),deleteTime=Date.parse(stamp)||0,remoteTime=Date.parse(row?.updated_at||0)||0;if(!row||deleteTime>remoteTime){const meta=db._deletedEntryMeta?.[id]||{};push.push({space_id:cloudSpaceId,id,type:meta.type||row?.type||'deleted',payload:row?.payload||{},is_deleted:true,owner_id:meta.owner_id||row?.owner_id||uid,visibility:meta.visibility||row?.visibility||'shared',updated_at:stamp,updated_by:uid})}}
if(push.length){const {error:writeError}=await client.from('couple_entries').upsert(push,{onConflict:'space_id,id'});if(writeError)throw writeError}
if(changed){cloudApplying=true;try{localStorage.setItem(KEY,JSON.stringify(db));await removeUnusedPhotos();render()}finally{cloudApplying=false}}cloudMessage='已同步';}
function requestCloudSync(){if(!cloudSession||!cloudSpaceId)return Promise.resolve();if(cloudSyncPromise){cloudSyncAgain=true;return cloudSyncPromise}cloudSyncPromise=syncCloudNow().catch(err=>{console.error(err);cloudMessage='云同步暂不可用：'+(err.message||'请检查网络');const status=document.querySelector('.cloud-message');if(status)status.textContent=cloudMessage}).finally(()=>{cloudSyncPromise=null;if(cloudSyncAgain){cloudSyncAgain=false;requestCloudSync()}});return cloudSyncPromise}
async function signOutCloud(){try{await cloudClient().auth.signOut();if(cloudRealtime)cloudClient().removeChannel(cloudRealtime);cloudRealtime=null;cloudSession=null;cloudSpaceId='';cloudSpaceInfo=null;localStorage.removeItem('wzj-cloud-space');document.querySelector('.cloud-back')?.remove();render()}catch(err){toast(err.message||'退出失败')}}
async function copyCloudInvite(){try{await navigator.clipboard.writeText(cloudSpaceInfo?.invite_code||'');toast('邀请码已复制')}catch{toast('复制失败，请长按邀请码复制')}}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});function showInstallHint(){if(localStorage.getItem('wzj-install-hint-seen')==='1'||window.matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;localStorage.setItem('wzj-install-hint-seen','1');setTimeout(()=>{if(document.querySelector('.install-hint'))return;const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),android=/android/i.test(navigator.userAgent);const instruction=ios?'在 Safari 底部点"分享"图标，再选择"添加到主屏幕"。':android?'在浏览器菜单中选择"安装应用"或"添加到主屏幕"。':'可在浏览器菜单中选择"安装帧藏"或"添加到主屏幕"。';const el=document.createElement('section');el.className='install-hint';el.innerHTML=`<b>把帧藏添加到主屏幕</b><p>${instruction}</p><div class="install-hint-actions"><button class="btn small" onclick="this.closest('.install-hint').remove()">稍后</button>${deferredInstallPrompt?'<button class="btn primary small" onclick="installPwa()">立即安装</button>':''}</div>`;document.body.append(el)},1400)}
async function installPwa(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.querySelector('.install-hint')?.remove()}
async function initCloud(){if(!window.supabase?.createClient)return;const client=cloudClient(),{data,error}=await client.auth.getSession();if(error)throw error;cloudSession=data.session;client.auth.onAuthStateChange((_event,session)=>{cloudSession=session;setTimeout(()=>{if(session){loadCloudSpace()}else{cloudSpaceId='';cloudSpaceInfo=null;render()}},0)});if(cloudSession)await loadCloudSpace()}

const preferenceIdeas=[['饮料的小偏好','TA 更喜欢热饮还是冰饮？平时会点什么？'],['喜欢的口感','TA 偏爱脆脆的、软糯的、清淡的，还是重口一点？'],['疲惫时的陪伴','TA 累的时候更喜欢安静待着、聊聊天，还是一个拥抱？'],['早晨的习惯','TA 喜欢早起还是睡到自然醒？']];
let modal=null,editId=null;
async function bootApp(){try{await migrateLegacyPhotos();await loadPhotoCache();await initCloud()}catch(err){console.error(err);toast('云端初始化暂不可用，本机记录仍保留。')}render()}
bootApp();showInstallHint();if(localStorage.getItem('wzj-theme')==='dark')document.body.classList.add('dark');function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('wzj-theme',document.body.classList.contains('dark')?'dark':'light');render()}
</script></body>
